version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: bitnami/kafka:3.7
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 5

  live_dashboard_backend:
    build: ./live_dashboard_backend
    ports:
      - "8081:8081"
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy

  investment_dashboard_backend:
    build: ./investment_dashboard_backend
    ports:
      - "8082:8082"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC=trading_signals
      - KAFKA_GROUP_ID=invest_dashboard_group
    depends_on:
      kafka:
        condition: service_healthy

  notification_router:
    build: ./notification_router
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC=trading_signals
      - KAFKA_GROUP_ID=notification_router_group
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      kafka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  email_worker:
    build: ./email_worker
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    deploy:
      replicas: 3
    depends_on:
      rabbitmq:
        condition: service_healthy

  console_alert_worker:
    build: ./console_alert_worker
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy

  market_data_feed:
    build: ./market_data_feed
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy

  ingestion_bridge:
    build: ./ingestion_bridge
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy

  analytics_engine:
    build: ./analytics_engine
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

networks:
  default:
    name: trading_net
