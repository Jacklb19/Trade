version: "3.8"

services:
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: on-failure

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: '0clIZrVtQiqCDDxc7xV6MQ'
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_LISTENERS: 'INTERNAL://0.0.0.0:9092,CONTROLLER://kafka:9093'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 3000
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: on-failure

  market_data_feed:
    build: ./market_data_feed
    container_name: market_data_feed
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
    restart: on-failure

  live_dashboard_backend:
    build: ./live_dashboard_backend
    container_name: live_dashboard_backend
    ports:
      - "8081:8081"
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    restart: on-failure

  ingestion_bridge:
    build: ./ingestion_bridge
    container_name: ingestion_bridge
    depends_on:
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    restart: on-failure

  analytics_engine:
    build: ./analytics_engine
    container_name: analytics_engine
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    restart: on-failure

  investment_dashboard_backend:
    build: ./investment_dashboard_backend
    container_name: investment_dashboard_backend
    ports:
      - "8082:8082"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    restart: on-failure

  notification_router:
    build: ./notification_router
    container_name: notification_router
    depends_on:
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    restart: on-failure

  email_worker_1:
    build: ./email_worker
    container_name: email_worker_1
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      WORKER_ID: "1"
    restart: on-failure

  email_worker_2:
    build: ./email_worker
    container_name: email_worker_2
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      WORKER_ID: "2"
    restart: on-failure

  email_worker_3:
    build: ./email_worker
    container_name: email_worker_3
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      WORKER_ID: "3"
    restart: on-failure

  console_alert_worker:
    build: ./console_alert_worker
    container_name: console_alert_worker
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    restart: on-failure

volumes:
  kafka_data:
  rabbitmq_data:
